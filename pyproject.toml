[project]
name = "mdb-apps"
version = "0.1.0"
description = "Pilot harness: how much does the database choice cost an agent when an app has to change?"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "colorama>=0.4.6",
    "tzdata>=2026.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["scenarios"]
pythonpath = ["."]

[tool.uv]
package = false
